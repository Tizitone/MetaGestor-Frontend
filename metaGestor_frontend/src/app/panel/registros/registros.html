<section class="page" aria-labelledby="registros-title">
  <header class="page__header">
    <div>
      <p class="page__eyebrow">Gestión · Registros</p>
      <h1 id="registros-title" class="page__title">Registros</h1>
      <p class="page__description">
        Seguimiento de trabajos por cliente, tarea y estado del proceso. Los identificadores se
        resuelven automáticamente con los nombres de clientes y empleados.
      </p>
    </div>
    <p class="page__summary">
      <strong>{{ registros().length }}</strong> registros de trabajo
    </p>
  </header>

  <app-data-table
    caption="Registros"
    searchPlaceholder="Buscar por título, cliente, tarea, participantes o estado…"
    emptyMessage="No hay registros que coincidan con la búsqueda."
    [columns]="columns"
    [rows]="registros()"
    [rowId]="rowId"
  />
</section>
