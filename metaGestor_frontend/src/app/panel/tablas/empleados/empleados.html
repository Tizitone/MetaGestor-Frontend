<section class="page" aria-labelledby="empleados-title">
  <header class="page__header">
    <div>
      <p class="page__eyebrow">Gestión · Empleados</p>
      <h1 id="empleados-title" class="page__title">Empleados</h1>
      <p class="page__description">
        Administra el personal registrado: crea, modifica o elimina empleados y revisa la cantidad
        de tareas que integran su historial.
      </p>
    </div>
    <p class="page__summary">
      <strong>{{ empleados().length }}</strong> empleados activos
    </p>
  </header>

  <div class="page__actions">
    <button type="button" class="page__boton" (click)="abrirCreacion()">
      <span aria-hidden="true">+</span> Nuevo empleado
    </button>
  </div>

  @if (errorEliminar()) {
    <p class="page__alerta" role="alert">{{ errorEliminar() }}</p>
  }

  <app-data-table
    caption="Empleados"
    searchPlaceholder="Buscar por legajo, nombre, correo, teléfono o DNI…"
    emptyMessage="No hay empleados que coincidan con la búsqueda."
    [columns]="columns"
    [rows]="empleados()"
    [rowId]="rowId"
    [mostrarAcciones]="true"
    (filaModificada)="abrirModificacion($event)"
    (filaEliminada)="eliminar($event)"
  />

  @if (modalAbierta()) {
    <app-modal [titulo]="tituloModal()" (cerrar)="cerrarModal()">
      <app-form-empleado
        [empleado]="empleadoEnEdicion()"
        (cancelar)="cerrarModal()"
        (guardado)="cerrarModal()"
      />
    </app-modal>
  }
</section>
