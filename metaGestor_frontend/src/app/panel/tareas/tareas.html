<section class="page" aria-labelledby="tareas-title">
  <header class="page__header">
    <div>
      <p class="page__eyebrow">Gestión · Tareas</p>
      <h1 id="tareas-title" class="page__title">Tareas</h1>
      <p class="page__description">
        Consulta las tareas de fabricación, su categoría, fechas y materiales. Filtra por categoría
        o busca por descripción, material o fecha.
      </p>
    </div>
    <p class="page__summary">
      <strong>{{ tareas().length }}</strong> tareas registradas
    </p>
  </header>

  <app-data-table
    caption="Tareas"
    searchPlaceholder="Buscar por descripción, material, categoría o fecha…"
    emptyMessage="No hay tareas que coincidan con la búsqueda."
    [columns]="columns"
    [rows]="tareas()"
    [rowId]="rowId"
  />
</section>
