<section class="page" aria-labelledby="clientes-title">
  <header class="page__header">
    <div>
      <p class="page__eyebrow">Gestión · Clientes</p>
      <h1 id="clientes-title" class="page__title">Clientes</h1>
      <p class="page__description">
        Consulta la cartera de clientes, filtra por datos de contacto y busca por nombre, correo,
        teléfono o DNI.
      </p>
    </div>
    <p class="page__summary">
      <strong>{{ clientes().length }}</strong> clientes registrados
    </p>
  </header>

  <app-data-table
    caption="Clientes"
    searchPlaceholder="Buscar por nombre, correo, teléfono o DNI…"
    emptyMessage="No hay clientes que coincidan con la búsqueda."
    [columns]="columns"
    [rows]="clientes()"
    [rowId]="rowId"
  />
</section>
