<div class="shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="MetaGestor, volver al sitio">
      <span class="brand__mark" aria-hidden="true">MG</span>
      <span class="brand__text">MetaGestor <small>Gestión</small></span>
    </a>

    <nav class="nav" aria-label="Secciones del panel">
      @for (section of sections(); track section.path) {
        <a
          class="nav__link"
          [routerLink]="section.path"
          routerLinkActive="nav__link--active"
          #link="routerLinkActive"
          [attr.aria-current]="link.isActive ? 'page' : null"
        >
          <span>{{ section.label }}</span>
          <span class="nav__count">{{ section.count }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <a class="sidebar__link" routerLink="/">← Volver al sitio</a>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div>
        <p class="topbar__eyebrow">Panel de gestión</p>
        <p class="topbar__title">Administración MetaGestor</p>
      </div>
      <p class="topbar__date">{{ today }}</p>
    </header>

    <main class="workspace__main">
      <router-outlet />
    </main>
  </div>
</div>
